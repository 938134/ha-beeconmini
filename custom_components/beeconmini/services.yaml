# BeeconMini 无线 AC —— 域级服务定义
#
# ⚠️ 本文件必须存在：缺失时 HA 会在启动日志里报
#    「Failed to load services.yaml for integration: beeconmini」，
#    且「开发者工具 → 操作」里两个服务都没有表单与说明。
#
# 这里只描述「参数长什么样、该用什么控件」，真正的取值校验在
# services.py 的 voluptuous schema 里。

kick_client:
  name: 剔除终端
  description: >-
    按 MAC 地址剔除指定无线终端。走厂商原生实现（act:249），
    属**一次性断连**，终端稍后可自动重连；如需持续封禁请改用 UCI 黑名单。
    日常也可直接在**该终端的设备页**（从 AP 设备页的「已连接的设备」卡片点进去）
    点控制区的「剔除终端」按钮，效果相同。
  fields:
    mac:
      name: MAC 地址
      description: 目标终端的 MAC 地址，支持 aa:bb:cc:dd:ee:ff 或 aa-bb-cc-dd-ee-ff。
      required: true
      example: "aa:bb:cc:dd:ee:ff"
      selector:
        text:

reboot_ap:
  name: 重启单台 AP
  description: >-
    只重启**指定的一台** AP，其余 AP 不受影响，AC 自身也不重启。
    走厂商固件的 cocmd 通道（AC→AP shell 下发），定向由 MAC 决定。
    目标 AP 会在数十秒内掉线，约 1–2 分钟后自行回上线（运行时长归零）。
    也可以直接在**该 AP 的设备页**控制区点「重启此 AP」按钮，效果相同。
    ⚠️ 要一次性重启全部 AP 请用 reboot_aps（不填时间）。
  fields:
    mac:
      name: AP 的 MAC
      description: 目标 AP 的 MAC，支持 aa:bb:cc:dd:ee:ff 或 aa-bb-cc-dd-ee-ff。与 name 二选一。
      required: false
      example: "aa:bb:cc:dd:ee:ff"
      selector:
        text:
    name:
      name: AP 名称
      description: 目标 AP 的名称（如「悦房」）。与 mac 二选一；两者都给时以 mac 为准。
      required: false
      selector:
        text:

run_ap_command:
  name: 在单台 AP 上执行命令
  description: >-
    ⚠️ 排障用：把一段 shell 经 cocmd 通道下发到**指定的那一台 AP** 上，
    由 AP 侧脚本以 **root** 身份 eval 执行，回显写进 HA 日志，
    并同时触发 beeconmini_ap_command_result 事件。
    适合同步很快返回的只读命令（logread / iwinfo / cat /proc/...）。
    命令使 AP 掉线时（如 reboot）拿不到回显，属正常现象，不代表没执行。
  fields:
    mac:
      name: AP 的 MAC
      description: 目标 AP 的 MAC。与 name 二选一。
      required: false
      example: "aa:bb:cc:dd:ee:ff"
      selector:
        text:
    name:
      name: AP 名称
      description: 目标 AP 的名称（如「悦房」）。与 mac 二选一。
      required: false
      selector:
        text:
    command:
      name: 命令
      description: 在该 AP 上执行的 shell（单行）。示例：logread | tail -30
      required: true
      example: "logread | tail -30"
      selector:
        text:

reboot_aps:
  name: 重启全部纳管 AP
  description: >-
    「小时 / 分钟」留空 = **立即重启全部纳管 AP**：走固件真实的 bxplug 重启通道
    （等价于按复位键），**AC 自身不重启**，AP 掉线约 40–110 秒后自动回上线。
    ⚠️ 只想重启其中一台请改用 reboot_ap，或在该 AP 设备页点「重启此 AP」。
    两者都填写 = 写入**定时重启**计划 —— ⚠️ 该计划**不会被执行**
    （固件缺少 /usr/share/rtmgr/reboot 脚本），写入值仅作记录。
  fields:
    hour:
      name: 小时
      description: 留空表示立即重启；取值范围 0-23。
      required: false
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minute:
      name: 分钟
      description: 留空表示立即重启；取值范围 0-59。
      required: false
      selector:
        number:
          min: 0
          max: 59
          mode: box
    day:
      name: 重启日
      description: 1-7 = 周一至周日，8 = 每天。
      required: false
      default: 8
      selector:
        number:
          min: 1
          max: 8
          mode: box
    enabled:
      name: 启用定时
      description: 仅「定时重启」时生效。
      required: false
      default: true
      selector:
        boolean:
